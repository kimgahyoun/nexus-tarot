<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS TAROT - 상담 결과</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 폰트 및 기본 설정 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { 
            background-color: #050508; 
            color: #e0e0e0; 
            font-family: 'Pretendard', sans-serif; 
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column; /* 버튼 배치를 위해 column 추가 */
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* ✨ 별빛 배경 효과 */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 컨테이너 및 애니메이션 */
        .card-container { 
            background: rgba(26, 26, 26, 0.9); /* 캡처 시 가독성을 위해 불투명도 조절 */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 20px; 
            padding: 30px; 
            max-width: 400px; 
            width: 90%; 
            margin: 40px 0 20px 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            text-align: center; 
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s forwards ease-out;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #d4af37; font-size: 1.6rem; margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        .date { font-size: 0.8rem; color: #aaa; margin-bottom: 25px; font-style: italic; }
        
        .tarot-img { 
            width: 100%; 
            border-radius: 12px; 
            border: 1px solid #d4af37; 
            margin: 20px 0; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .result-box { 
            text-align: left; 
            background: rgba(40, 40, 40, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            line-height: 1.8;
            border-left: 3px solid #d4af37;
        }

        .highlight { color: #d4af37; font-weight: bold; font-size: 1.1rem; }
        
        /* ✨ 저장 버튼 스타일 */
        .save-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
            z-index: 10;
        }

        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); }
        .save-btn:active { transform: scale(0.95); }

        footer { margin-top: 40px; font-size: 0.75rem; color: #777; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="stars"></div>

    <div id="capture-area" class="card-container">
        <h1>🔮 NEXUS TAROT</h1>
        <div class="date" id="current-date">DATE</div>
        
        <div id="user-info" style="margin-bottom: 20px;">
            <span class="highlight" id="user-name">내담자</span>님의 미래 카드
        </div>

        <img id="card-image" src="https://via.placeholder.com/300x500?text=Tarot+Card" alt="타로 카드" class="tarot-img">
        
        <div class="result-box">
            <p><strong>카드:</strong> <span id="card-name" class="highlight"></span></p>
            <p><strong>방향:</strong> <span id="position">정방향</span></p>
            <div id="ai-response" style="font-size: 0.95rem; line-height: 1.7;"></div>
        </div>

        <footer>© 2026 AI+X NEXUS PROJECT</footer>
    </div>

    <button class="save-btn" onclick="saveResult()">
        📥 결과 이미지 저장하기
    </button>
    <p style="
    color: #999; 
    font-size: 0.8rem; 
    margin-top: 15px; 
    text-align: center; 
    line-height: 1.6;
    letter-spacing: -0.02em;
    ">
        브라우저에 따라 다운로드가 실행되지 않을 수 있습니다.<br>
        그럴 땐 <span style="color: #d4af37; font-weight: bold;">팝업 이미지를 꾹 눌러</span> 저장해 주세요.
    </p>
    <script>
        // 1. 배경 별 생성
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // 2. 🔥 QR 파라미터에서 데이터 로드 (핵심 변경!)
        async function loadCardData() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // QR에서 card 번호와 방향 추출
            const cardNum = parseInt(urlParams.get('card'));
            const direction = urlParams.get('dir') || 'upright';
            
            if (!cardNum || isNaN(cardNum)) {
                document.getElementById('ai-response').innerHTML = 
                    '❌ 유효하지 않은 카드 번호입니다. QR 코드를 다시 스캔해주세요.';
                return;
            }

            try {
                // QR_data.json에서 카드 데이터 가져오기
                const response = await fetch('./data/QR_data.json');
                const data = await response.json();
                const card = data.cards.find(c => c.number === cardNum);
                
                if (!card) {
                    document.getElementById('ai-response').innerHTML = 
                        '❌ 해당 카드를 찾을 수 없습니다.';
                    return;
                }

                // 데이터 표시
                document.getElementById('card-name').textContent = card.name;
                document.getElementById('position').textContent = 
                    direction === 'upright' ? '정방향' : '역방향';
                document.getElementById('card-image').src = 
                    `./images/tarot_cards/Card_${cardNum}.jpg`;
                document.getElementById('ai-response').innerHTML = 
                    card[direction === 'upright' ? 'upright_advice' : 'reversed_advice']
                    .replace(/\n/g, '<br>');

                // 사용자 이름 (선택사항)
                if(urlParams.has('name')) {
                    document.getElementById('user-name').textContent = 
                        decodeURIComponent(urlParams.get('name'));
                }

            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('ai-response').innerHTML = 
                    '❌ 데이터를 불러오는 중 오류가 발생했습니다.<br>서버 상태를 확인해주세요.';
            }
        }

        // 3. 현재 날짜 표시 (기존)
        document.getElementById('current-date').innerText = 
            new Date().toLocaleDateString('ko-KR', {
                year: 'numeric', month: 'long', day: 'numeric'
            });

        // 4. 페이지 로드 시 데이터 로드 실행
        window.addEventListener('load', loadCardData);

        // 5. 이미지 저장 함수 (구조 정밀 보정)
        function saveResult() {
            const btn = document.querySelector('.save-btn');
            const originalText = btn.innerText;
            const area = document.getElementById('capture-area');
            
            btn.innerText = "⏳ 저장 중...";
            
            html2canvas(area, {
                backgroundColor: "#1a1a1a",
                scale: 2,
                useCORS: true,
                logging: false,
                onclone: (clonedDoc) => {
                    const clonedArea = clonedDoc.getElementById('capture-area');
                    clonedArea.style.opacity = "1";
                    clonedArea.style.transform = "none";
                    clonedArea.style.background = "#1a1a1a";
                }
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                
                // 1. 결과 오버레이 레이어 생성
                const overlay = document.createElement('div');
                overlay.id = "result-overlay";
                overlay.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(5px); animation:fadeIn 0.3s; padding:20px; box-sizing:border-box;";
                
                overlay.innerHTML = `
                    <div style="text-align:center; margin-bottom:15px; animation:slideDown 0.4s;">
                        <p style="color:#d4af37; font-size:1.1rem; font-weight:bold; margin:0;">✨ 저장 준비 완료!</p>
                    </div>
                    
                    <img src="${imgData}" style="width:90%; max-width:380px; border:2px solid #d4af37; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.5); margin-bottom:20px;">
                `;
                
                document.body.appendChild(overlay);
                
                // 닫기 로직 (배경 클릭 시)
                overlay.onclick = () => {
                    document.body.removeChild(overlay);
                    btn.innerText = originalText;
                };
        
                // PC용 자동 다운로드 병행
                const link = document.createElement('a');
                link.href = imgData;
                link.download = `Nexus_Tarot_Result.png`;
                link.click();
                
                btn.innerText = originalText;
            }).catch(err => {
                console.error("저장 실패:", err);
                btn.innerText = "❌ 재시도";
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }
    </script>
</body>
</html>
