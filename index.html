<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS TAROT - 상담 결과</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 폰트 및 기본 설정 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { 
            background-color: #050508; 
            color: #e0e0e0; 
            font-family: 'Pretendard', sans-serif; 
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column; /* 버튼 배치를 위해 column 추가 */
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* ✨ 별빛 배경 효과 */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 컨테이너 및 애니메이션 */
        .card-container { 
            background: rgba(26, 26, 26, 0.9); /* 캡처 시 가독성을 위해 불투명도 조절 */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 20px; 
            padding: 30px; 
            max-width: 400px; 
            width: 90%; 
            margin: 40px 0 20px 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            text-align: center; 
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s forwards ease-out;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: #d4af37; font-size: 1.6rem; margin-bottom: 5px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        .date { font-size: 0.8rem; color: #aaa; margin-bottom: 25px; font-style: italic; }
        
        .tarot-img { 
            width: 100%; 
            border-radius: 12px; 
            border: 1px solid #d4af37; 
            margin: 20px 0; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .result-box { 
            text-align: left; 
            background: rgba(40, 40, 40, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            line-height: 1.8;
            border-left: 3px solid #d4af37;
        }

        .highlight { color: #d4af37; font-weight: bold; font-size: 1.1rem; }
        
        /* ✨ 저장 버튼 스타일 */
        .save-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
            z-index: 10;
        }

        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); }
        .save-btn:active { transform: scale(0.95); }

        footer { margin-top: 40px; font-size: 0.75rem; color: #777; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="stars"></div>

    <div id="capture-area" class="card-container">
        <h1>🔮 NEXUS TAROT</h1>
        <div class="date" id="current-date">DATE</div>
        
        <div id="user-info" style="margin-bottom: 20px;">
            <span class="highlight" id="user-name">내담자</span>님의 상담 결과
        </div>

        <img id="card-image" src="https://via.placeholder.com/300x500?text=Tarot+Card" alt="타로 카드" class="tarot-img">
        
        <div class="result-box">
            <p><strong>주제:</strong> <span id="topic">연애운</span></p>
            <p id="ai-response" style="font-size: 0.95rem;">AI 마스터가 당신의 미래를 해석하고 있습니다...</p>
        </div>

        <footer>© 2026 AI+X NEXUS PROJECT</footer>
    </div>

    <button class="save-btn" onclick="saveResult()">
        📥 결과 이미지 저장하기
    </button>

    <script>
        // 1. 배경 별 생성
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // 2. 데이터 로드 로직
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('name')) document.getElementById('user-name').innerText = urlParams.get('name');
        if(urlParams.has('topic')) document.getElementById('topic').innerText = urlParams.get('topic');
        if(urlParams.has('text')) {
            const cleanText = decodeURIComponent(urlParams.get('text')).replace(/\\n/g, '<br>');
            document.getElementById('ai-response').innerHTML = cleanText;
        }
        if(urlParams.has('card')) {
            const cardId = urlParams.get('card'); 
            document.getElementById('card-image').src = `./images/tarot_cards/Card_${cardId}.jpg`;
        }

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        // 3. 이미지 저장 함수 (구조 정밀 보정)
        function saveResult() {
            const btn = document.querySelector('.save-btn');
            const originalText = btn.innerText;
            const area = document.getElementById('capture-area');
            
            btn.innerText = "⏳ 저장 중...";
            
            html2canvas(area, {
                backgroundColor: "#1a1a1a", // 배경을 확실하게 지정
                scale: 2,
                useCORS: true,
                logging: false,
                // ✨ 이 onclone 부분이 있어야 이미지가 밝게 나옵니다!
                onclone: (clonedDoc) => {
                    const clonedArea = clonedDoc.getElementById('capture-area');
                    clonedArea.style.opacity = "1";
                    clonedArea.style.transform = "none";
                    clonedArea.style.background = "#1a1a1a"; // 캡처본 배경 강제 고정
                    
                    const resultBox = clonedArea.querySelector('.result-box');
                    if (resultBox) {
                        resultBox.style.background = "#252525";
                        resultBox.style.color = "#e0e0e0";
                    }
                }
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                
                // 레이어 팝업으로 띄워주기 (모바일/PC 공통으로 가장 확실함)
                const overlay = document.createElement('div');
                overlay.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;";
                
                overlay.innerHTML = `
                    <p style="color:#d4af37; margin-bottom:15px; font-weight:bold; text-align:center;">👇 이미지를 꾹 눌러 '사진 저장' 하세요!<br><span style="font-size:12px; font-weight:normal; color:#aaa;">(PC는 자동으로 다운로드됩니다)</span></p>
                    <img src="${imgData}" style="width:100%; max-width:400px; border:2px solid #d4af37; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
                    <button id="close-overlay" style="margin-top:20px; padding:12px 40px; background:#d4af37; color:black; border:none; border-radius:25px; font-weight:bold; cursor:pointer;">창 닫기</button>
                `;
                
                document.body.appendChild(overlay);
                
                document.getElementById('close-overlay').onclick = () => {
                    document.body.removeChild(overlay);
                    btn.innerText = originalText;
                };
        
                // PC용 자동 다운로드 시도
                const link = document.createElement('a');
                link.href = imgData;
                link.download = `Nexus_Tarot_Result.png`;
                link.click();
                
                btn.innerText = originalText;
            }).catch(err => {
                console.error("저장 실패:", err);
                btn.innerText = "❌ 재시도";
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }
    </script>
</body>
</html>
